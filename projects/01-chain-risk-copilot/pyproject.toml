[project]
name = "chainrisk"
version = "0.1.0"
description = "Chain Risk Copilot — real-time Ethereum data platform and AML copilot"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "confluent-kafka>=2.6",
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "requests>=2.32",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chainrisk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/smoke_test.py matches pytest's default *_test.py; it is a script, not a test.
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = ["integration: requires the local stack to be running"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
