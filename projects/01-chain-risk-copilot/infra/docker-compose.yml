# Chain Risk Copilot — local development stack (ADR 0003).
#
#   docker compose -f infra/docker-compose.yml up -d     # start
#   docker compose -f infra/docker-compose.yml ps        # all long-running services -> (healthy)
#   docker compose -f infra/docker-compose.yml down      # stop, KEEP data
#   docker compose -f infra/docker-compose.yml down -v   # stop, WIPE data (named volumes)
#
# Credentials come from infra/.env (gitignored); see infra/.env.example.
#
# Host ports
#   19092  Kafka API (external listener)       18081  Schema Registry
#   18082  HTTP Proxy (pandaproxy)             19644  Redpanda Admin API
#   8085   Redpanda Console                    9000   MinIO S3 API
#   9001   MinIO console                       5433   Postgres (ops)
#   8080   Airflow UI / API server (login: AIRFLOW_ADMIN_* in infra/.env)

name: chainrisk

# Shared by every Airflow container (CRC-17). LocalExecutor: tasks run as subprocesses of the
# scheduler, so there is no Redis, Celery worker or Flower. The official quick-start compose
# (CeleryExecutor, nine services) asks for 4 GB for Airflow alone; this stack has 6 GB in total.
x-airflow-common: &airflow-common
  # Built from infra/airflow/Dockerfile, whose FROM is pinned by digest.
  build: ./airflow
  image: chainrisk-airflow:3.4.0
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Memory is the constraint (ADR 0003): Airflow plus one ingest task (~0.9 GiB peak, measured)
    # fits in 6 GB, two ingest tasks at once do not. One task at a time is a correctness
    # limit, not tuning; raise it only after raising Docker's memory allocation.
    AIRFLOW__CORE__PARALLELISM: "1"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${AIRFLOW_DB_USER:?set AIRFLOW_DB_USER in infra/.env}:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in infra/.env}@airflow-postgres/${AIRFLOW_DB_NAME:?set AIRFLOW_DB_NAME in infra/.env}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in infra/.env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in infra/.env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Paused at creation: the DAG does nothing until it is unpaused on purpose.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # The DAG imports chainrisk.ingest.bronze from the mounted source tree (no install step).
    PYTHONPATH: /opt/airflow/src
    # chainrisk.settings reads these from the environment; inside a container there is no
    # infra/.env, and localhost would be the container itself. It also requires the
    # postgres-ops fields, though the ingest never opens that connection.
    MINIO_HOST: minio
    MINIO_PORT: "9000"
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
    POSTGRES_OPS_USER: ${POSTGRES_OPS_USER:?set POSTGRES_OPS_USER in infra/.env}
    POSTGRES_OPS_PASSWORD: ${POSTGRES_OPS_PASSWORD:?set POSTGRES_OPS_PASSWORD in infra/.env}
    POSTGRES_OPS_DB: ${POSTGRES_OPS_DB:?set POSTGRES_OPS_DB in infra/.env}
  volumes:
    # dags/ stays at the project root, next to the package it imports (not under infra/).
    - ../dags:/opt/airflow/dags:ro
    - ../src:/opt/airflow/src:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
    minio:
      condition: service_healthy

services:

  # ── Streaming: Kafka API + built-in Schema Registry ────────────
  redpanda:
    image: redpandadata/redpanda:v26.2.2
    container_name: chainrisk-redpanda
    command:
      - redpanda
      - start
      # Dual listeners. Containers use redpanda:9092; the host uses localhost:19092.
      # A client is handed the *advertised* address after its first connection, so
      # a host client pointed at the internal listener would connect once, then fail.
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      # dev-container: relaxed fsync, overprovisioned CPU — local development only.
      - --mode dev-container
      - --smp 1
      # Cap memory so Redpanda leaves room for Airflow within Docker's 6 GB.
      - --memory 1G
      - --reserve-memory 0M
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:v3.11.0
    container_name: chainrisk-redpanda-console
    # Console reads its config from a file; render it from an env var at startup.
    # (Pattern from Redpanda's reference compose for this Console version.)
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && exec /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      # Console listens on 8080 inside the container; publish on 8085 so Airflow
      # can take host port 8080.
      - "8085:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Object storage: local S3 stand-in for bronze ───────────────
  minio:
    # MinIO community went EOL (repo archived Apr 2026); minio/minio stopped
    # serving anonymous pulls on both Docker Hub and quay.io, which now hosts
    # only the commercial AIStor image. Chainguard builds MinIO from source and
    # serves it free, but publishes only :latest — so we pin by digest.
    # Caveat: Chainguard's free tier may garbage-collect old digests. If a fresh
    # clone fails to pull, refresh the pin. See ADR 0005.
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    container_name: chainrisk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # Neither curl nor grep exist in this image (distroless), and `mc ping`
      # needs an admin client/alias we haven't set up here — so hit the health
      # endpoint over bash's /dev/tcp (sh is a bash symlink in this image)
      # and match the status line with a case pattern instead of grep.
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r line <&3
          case "$$line" in *" 200 "*) exit 0 ;; *) exit 1 ;; esac
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    # Chainguard's minio-client is distroless: no shell, ENTRYPOINT is mc itself.
    # MC_HOST_<alias> replaces `mc alias set`, and `mc mb` takes several targets,
    # so the whole bootstrap is one command and needs no shell.
    image: cgr.dev/chainguard/minio-client@sha256:ad8dcbf569b9ae56536c3cfd23b850cb05b42fd6aae22767ae66acbcf161a224
    container_name: chainrisk-minio-init
    # One-shot. Waiting for *healthy*, not merely *started*: a started MinIO can
    # still refuse connections, which makes this race and fail only sometimes.
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}:${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}@minio:9000
    # --ignore-existing suppresses the error, not the message: "Bucket created successfully"
    # prints on every run, even when the bucket already existed (CH-003).
    command: ["mb", "--ignore-existing", "local/chainrisk-bronze", "local/chainrisk-artifacts"]
    restart: "no"

  # ── Operational Postgres: watchlists, alert rules, annotations ─
  postgres-ops:
    image: postgres:16.15
    container_name: chainrisk-postgres-ops
    # Logical replication settings for Debezium (Phase 5). wal_level only takes
    # effect at server start, so set it now rather than recreate the container later.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_USER: ${POSTGRES_OPS_USER:?set POSTGRES_OPS_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_OPS_PASSWORD:?set POSTGRES_OPS_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_OPS_DB:?set POSTGRES_OPS_DB in infra/.env}
    ports:
      # 5433 on the host, so a locally installed Postgres on 5432 doesn't collide.
      - "5433:5432"
    volumes:
      - postgres-ops-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Orchestration: Airflow (CRC-17) ────────────────────────────
  # Metadata DB: its own instance, never postgres-ops (that one is wal_level=logical for
  # Debezium in P5; Airflow's tables there would surface later as a CDC problem).
  airflow-postgres:
    image: postgres:16.15
    container_name: chainrisk-airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?set AIRFLOW_DB_USER in infra/.env}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in infra/.env}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:?set AIRFLOW_DB_NAME in infra/.env}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot: migrates the metadata DB and creates the admin user, then exits 0. Unlike
  # minio-init it needs no separate run: the Airflow services depend on it with
  # service_completed_successfully, so compose runs it first and `up --wait` does not treat
  # its exit as a failure. Keep it out of the `up` service lists (the drift test enforces it).
  airflow-init:
    <<: *airflow-common
    container_name: chainrisk-airflow-init
    # `version` is a no-op command; the image entrypoint does the work from these variables.
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?set AIRFLOW_ADMIN_USER in infra/.env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in infra/.env}
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: chainrisk-airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Runs tasks in-process under LocalExecutor, so this is where an ingest task's memory goes.
  airflow-scheduler:
    <<: *airflow-common
    container_name: chainrisk-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Airflow 3 parses DAG files in their own component (in 2.x the scheduler did it).
  airflow-dag-processor:
    <<: *airflow-common
    container_name: chainrisk-airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

# Named volumes survive `down`; only `down -v` removes them.
volumes:
  redpanda-data:
  minio-data:
  postgres-ops-data:
  airflow-postgres-data:
  airflow-logs:
